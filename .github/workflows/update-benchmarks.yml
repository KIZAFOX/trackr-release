name: Update Match-V5 benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate benchmarks from Riot Match-V5
        run: node scripts/generate-benchmarks.js
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          BENCHMARK_ACCOUNTS_PER_TIER: 5
          BENCHMARK_MATCHES_PER_ACCOUNT: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
